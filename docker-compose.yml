services:
  postgis:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: uspop
      POSTGRES_PASSWORD: uspop
      POSTGRES_DB: uspop
    ports:
      - "5433:5432"
    volumes:
      - uspop_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uspop -d uspop"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  uspop_pgdata:
